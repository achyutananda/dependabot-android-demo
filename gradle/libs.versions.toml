[versions]
agp = "8.13.2"
kotlin = "2.0.21"
coreKtx = "1.13.1"          # outdated: 1.17.0 available
junit = "4.13.2"
junitVersion = "1.3.0"       # outdated: 1.3.0 available
espressoCore = "3.7.0"       # outdated: 3.7.0 available
lifecycleRuntimeKtx = "2.7.0" # outdated: 2.10.0 available
activityCompose = "1.8.2"    # outdated: 1.12.4 available
composeBom = "2023.10.00"    # outdated: 2024.09.00 available
sonar = "4.3.1.3277"         # outdated: 4.4.1.3373 available
dokka = "1.9.10"             # outdated: 1.9.20 available

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-compose-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }

# Build-logic compile-only deps (referenced in build-logic/convention/build.gradle.kts)
build-android-gradlePlugin = { group = "com.android.tools.build", name = "gradle", version.ref = "agp" }
build-kotlin-gradlePlugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
build-sonar-gradlePlugin = { group = "org.sonarsource.scanner.gradle", name = "sonarqube-gradle-plugin", version.ref = "sonar" }
build-dokka-gradlePlugin = { group = "org.jetbrains.dokka", name = "dokka-gradle-plugin", version.ref = "dokka" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
sonarqube = { id = "org.sonarqube", version.ref = "sonar" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }

# Convention plugins — resolved from build-conventions via composite build.
# Switch to version = "x.y.z" once published to a Maven registry.
slab-android-application = { id = "slab.android.application" }
slab-android-library = { id = "slab.android.library" }
slab-sonar = { id = "slab.sonar" }
slab-lint = { id = "slab.lint" }
slab-dokka = { id = "slab.dokka" }
slab-jacoco = { id = "slab.jacoco" }
